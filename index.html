<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy 23rd birthday, Rania</title>
<style>
:root{--bg:#f3e4ea;--ink:#2a2350;--paper:#fbf3ea;--shadow:rgba(60,30,70,.28);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a2b;--ink:#efe6f5;--paper:#e9dfd2;--shadow:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1e1a2b;--ink:#efe6f5;--paper:#e9dfd2;--shadow:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;overflow:hidden}
.stage{perspective:2200px;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.card{position:relative;width:var(--w);height:var(--h);transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.65,0,.2,1);cursor:pointer;outline:none;will-change:transform}
.card.open{transform:translateX(var(--tx)) scale(var(--s))}
.page,.cover{position:absolute;inset:0;border-radius:4px 10px 10px 4px}
.page{background:center/cover no-repeat;box-shadow:0 18px 40px var(--shadow)}
.cover{transform-origin:left center;transform-style:preserve-3d;transition:transform 1.3s cubic-bezier(.65,0,.2,1);will-change:transform}
.card:not(.open):hover .cover{transform:rotateY(-14deg);transition-duration:.5s}
.page::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(0,0,0,.4),rgba(0,0,0,.08) 45%,transparent 70%);opacity:1;transition:opacity 1.3s ease-out;pointer-events:none}
.card.open .page::after{opacity:0}
.page{transition:box-shadow 1.3s ease-out}
.card.open .page{box-shadow:0 28px 60px var(--shadow)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.card.open .cover{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:inherit;overflow:hidden}
.front{background:center/cover no-repeat;box-shadow:0 18px 40px var(--shadow)}
.back{transform:rotateY(180deg);background:var(--paper);box-shadow:inset -14px 0 24px rgba(0,0,0,.12)}
.back p{position:absolute;left:0;right:0;bottom:7%;margin:0;text-align:center;font-style:italic;color:#4a4268;font-size:calc(var(--w)*.045)}
.hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;font-size:15px;opacity:.75;transition:opacity .4s;pointer-events:none}
.card.open ~ .hint{opacity:.55}
.card:focus-visible .front{outline:3px solid var(--ink);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.card:not(.open):hover .cover{transform:none}}
</style>
</head>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="hint" id="hint">Tap the card to open it</div>
</div>
<script>
(function(){
  var card=document.getElementById('card'),hint=document.getElementById('hint'),R=1410/1996;
  function size(){
    var vw=window.innerWidth,vh=window.innerHeight;
    var w=Math.min(vw*.82,vh*.82*R),h=w/R;
    var s=Math.min(1,(vw*.95)/(2*w));
    var r=document.documentElement.style;
    r.setProperty('--w',w+'px');r.setProperty('--h',h+'px');
    r.setProperty('--s',s);r.setProperty('--tx',(w*s/2)+'px');
  }
  function toggle(){
    var o=card.classList.toggle('open');
    card.setAttribute('aria-expanded',o);
    card.setAttribute('aria-label','Birthday card. Press to '+(o?'close':'open')+'.');
    hint.textContent=o?'Tap to close':'Tap the card to open it';
    if(o)burst();
  }
  var cv=document.getElementById('confetti'),cx=cv.getContext('2d'),parts=[],raf=0;
  var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  var colors=['#6fa0d8','#f4a6c0','#ffd24a','#9b7be0','#ff9a62','#7ed6b5','#ffffff'];
  function fit(){var d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);}
  function add(x,y,n,a0,a1,s0,s1){
    n=Math.round(n*(reduce?.4:1));
    for(var i=0;i<n;i++){
      var a=(a0+Math.random()*(a1-a0))*Math.PI/180,sp=s0+Math.random()*(s1-s0);
      parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:-Math.sin(a)*sp,w:6+Math.random()*7,h:4+Math.random()*5,
        rot:Math.random()*6.28,vr:(Math.random()-.5)*.35,wob:Math.random()*6.28,vw:.1+Math.random()*.15,
        c:colors[(Math.random()*colors.length)|0],round:Math.random()<.3,life:0,max:150+Math.random()*90});
    }
  }
  function tick(){
    cx.clearRect(0,0,innerWidth,innerHeight);
    parts=parts.filter(function(p){return p.life<p.max&&p.y<innerHeight+30;});
    parts.forEach(function(p){
      p.vy+=.16;p.vx*=.985;p.vy*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.wob+=p.vw;p.life++;
      var fade=p.life>p.max*.7?1-(p.life-p.max*.7)/(p.max*.3):1;
      cx.save();cx.globalAlpha=Math.max(0,fade);cx.translate(p.x,p.y);cx.rotate(p.rot);cx.scale(1,Math.cos(p.wob));
      cx.fillStyle=p.c;
      if(p.round){cx.beginPath();cx.arc(0,0,p.h*.6,0,6.28);cx.fill();}else{cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);}
      cx.restore();
    });
    if(parts.length){raf=requestAnimationFrame(tick);}else{cx.clearRect(0,0,innerWidth,innerHeight);raf=0;}
  }
  function burst(){
    fit();
    setTimeout(function(){
      var w=innerWidth,h=innerHeight;
      add(w/2,h*.55,90,0,180,6,15);
      setTimeout(function(){add(0,h,55,55,85,13,22);add(w,h,55,95,125,13,22);},260);
      setTimeout(function(){add(w/2,h*.5,45,0,180,5,12);},620);
      if(!raf)raf=requestAnimationFrame(tick);
    },500);
  }
  card.addEventListener('click',toggle);
  card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
  window.addEventListener('resize',size);size();
})();
</script>
